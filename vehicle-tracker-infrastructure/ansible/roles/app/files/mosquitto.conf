per_listener_settings true

# Local-only listener, used by the container healthcheck. Not reachable from outside the container.
listener 1883 127.0.0.1
allow_anonymous true

# mTLS listener for devices. The broker presents tracker.crt; a client must present a certificate
# signed by the Identity Service CA, otherwise the TLS handshake fails.
listener 8883

allow_anonymous false

cafile /mosquitto/certs/identity-service.crt
certfile /mosquitto/certs/tracker.crt
keyfile /mosquitto/certs/tracker.key
require_certificate true

use_identity_as_username true
acl_file /mosquitto/config/mosquitto.acl

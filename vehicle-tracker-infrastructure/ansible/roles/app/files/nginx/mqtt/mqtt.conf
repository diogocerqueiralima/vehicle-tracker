# MQTT (mTLS). TLS is not terminated here, the bytes are forwarded untouched to mosquitto.
server {
    listen 8883;

    proxy_pass mosquitto:8883;
    proxy_connect_timeout 10s;  # how long to wait for the upstream to accept the connection
    proxy_timeout 5m;           # idle timeout for the connection to the upstream, MQTT keep-alive is 1 minute, so this must be longer than that
}

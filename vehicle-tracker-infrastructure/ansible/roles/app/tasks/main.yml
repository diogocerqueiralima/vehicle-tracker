---
# Runs as the deploy user (rootless Podman): no become.
- name: Check the secrets are set
  ansible.builtin.assert:
    that:
      - postgres_user | length > 0
      - postgres_password | length > 0
    fail_msg: POSTGRES_USER and POSTGRES_PASSWORD must be set in the environment.
    quiet: true

- name: Create app directories
  ansible.builtin.file:
    path: "{{ app_dir }}/{{ item }}"
    state: directory
    mode: "0700"
  loop: ["", env, mosquitto]

- name: Render the postgres env file
  ansible.builtin.template:
    src: postgres.env.j2
    dest: "{{ app_dir }}/env/postgres.env"
    mode: "0600"
  no_log: true

- name: Check the TLS certificate and key exist
  ansible.builtin.stat:
    path: "{{ tls_cert_dir }}/{{ item }}"
  register: tls_files
  failed_when: not tls_files.stat.exists
  loop: "{{ [tls_cert_file, tls_key_file] }}"

# Mode 0644: mosquitto drops to an unprivileged user (a subuid on the host) that must read it.
- name: Copy the mosquitto config
  ansible.builtin.copy:
    src: mosquitto.conf
    dest: "{{ app_dir }}/mosquitto/mosquitto.conf"
    mode: "0644"

- name: Render compose.yml
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ app_dir }}/compose.yml"
    mode: "0600"
  register: compose_file

# `podman compose` delegates to an external provider. Without this it can pick Docker's compose
# plugin, which needs a Docker API socket that rootless Podman does not provide.
- name: Pull the images
  ansible.builtin.command: podman compose -f compose.yml pull
  args:
    chdir: "{{ app_dir }}"
  environment:
    PODMAN_COMPOSE_PROVIDER: podman-compose
  changed_when: false

- name: Start the services
  ansible.builtin.command: podman compose -f compose.yml up -d
  args:
    chdir: "{{ app_dir }}"
  environment:
    PODMAN_COMPOSE_PROVIDER: podman-compose
  changed_when: false

# Every container of the compose project (name: app) must define a healthcheck and become healthy
- name: Wait for all services to be healthy
  ansible.builtin.shell: |
    ids=$(podman ps -aq --filter label=io.podman.compose.project=app)
    [ -n "$ids" ] || exit 1
    podman inspect --format '{% raw %}{{.Name}} {{.State.Health.Status}}{% endraw %}' $ids
  args:
    executable: /bin/bash
  register: services_health
  until: >-
    services_health.rc == 0 and
    (services_health.stdout_lines | reject('match', '^\S+ healthy$') | list | length == 0)
  retries: 20
  delay: 5
  changed_when: false

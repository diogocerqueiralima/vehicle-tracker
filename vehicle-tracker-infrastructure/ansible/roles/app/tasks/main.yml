---
# Runs as the deploy user (rootless Podman): no become.
- name: Check the secrets are set
  ansible.builtin.assert:
    that:
      - postgres_user | length > 0
      - postgres_password | length > 0
    fail_msg: POSTGRES_USER and POSTGRES_PASSWORD must be set in the environment.
    quiet: true

- name: Create app directories
  ansible.builtin.file:
    path: "{{ app_dir }}/{{ item }}"
    state: directory
    mode: "0700"
  loop: ["", env, mosquitto, nginx]

- name: Render the postgres env file
  ansible.builtin.template:
    src: postgres.env.j2
    dest: "{{ app_dir }}/env/postgres.env"
    mode: "0600"
  no_log: true

- name: Check the TLS certificate, key and Identity Service CA exist
  ansible.builtin.stat:
    path: "{{ tls_cert_dir }}/{{ item }}"
  register: tls_files
  failed_when: not tls_files.stat.exists
  loop: "{{ [tls_cert_file, tls_key_file, identity_ca_cert_file] }}"

# Mode 0600: the mosquitto container runs as the deploy user (userns_mode: keep-id in compose.yml).
- name: Copy the mosquitto config and ACL
  ansible.builtin.copy:
    src: "mqtt/{{ item }}"
    dest: "{{ app_dir }}/mosquitto/{{ item }}"
    mode: "0600"
  loop: [mosquitto.conf, mosquitto.acl]

- name: Copy the main nginx config
  ansible.builtin.copy:
    src: nginx/nginx.conf
    dest: "{{ app_dir }}/nginx/nginx.conf"
    mode: "0600"
  register: nginx_main_config

- name: Copy the nginx MQTT config
  ansible.builtin.copy:
    src: nginx/mqtt/mqtt.conf
    dest: "{{ app_dir }}/nginx/mqtt.conf"
    mode: "0600"
  register: nginx_mqtt_config

- name: Copy the nginx healthcheck config
  ansible.builtin.copy:
    src: nginx/healthcheck/healthcheck.conf
    dest: "{{ app_dir }}/nginx/healthcheck.conf"
    mode: "0600"
  register: nginx_healthcheck_config

- name: Render compose.yml
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ app_dir }}/compose.yml"
    mode: "0600"
  register: compose_file

# `podman compose` delegates to an external provider. Without this it can pick Docker's compose
# plugin, which needs a Docker API socket that rootless Podman does not provide.
- name: Pull the images
  ansible.builtin.command: podman compose -f compose.yml pull
  args:
    chdir: "{{ app_dir }}"
  environment:
    PODMAN_COMPOSE_PROVIDER: podman-compose
  changed_when: false

- name: Start the services
  ansible.builtin.command: podman compose -f compose.yml up -d
  args:
    chdir: "{{ app_dir }}"
  environment:
    PODMAN_COMPOSE_PROVIDER: podman-compose
  changed_when: false

# Fails if a container does not exist. `timeout` stops the wait if one never becomes healthy.
# A new service in compose.yml must be added to this list.
- name: Wait for all services to be healthy
  ansible.builtin.command: >-
    timeout 120 podman wait --condition=healthy
    app_postgres app_mosquitto app_nginx
  changed_when: false

# A config change does not recreate the container. A reload is not enough either: Ansible replaces the
# file, and a single-file bind mount keeps pointing to the old one until the container restarts.
- name: Restart nginx
  ansible.builtin.command: podman restart app_nginx
  when: nginx_main_config.changed or nginx_mqtt_config.changed or nginx_healthcheck_config.changed
  changed_when: true

# nginx resolves the upstream names only when it loads the config. A reload picks up the new address
# of a recreated container and keeps the open connections on the old workers until they close.
- name: Reload nginx
  ansible.builtin.command: podman exec app_nginx nginx -s reload
  changed_when: false

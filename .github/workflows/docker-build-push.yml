name: Docker Build & Push

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Set up WireGuard Connection
        uses: niklaskeerl/easy-wireguard-action@v2
        with:
          WG_CONFIG_FILE: ${{ secrets.WG_CONFIG_FILE }}
      - name: Trust Harbor CA in Docker
        env:
          HARBOR_CA_CRT: ${{ secrets.HARBOR_CA_CRT }}
          HARBOR_URL: ${{ secrets.HARBOR_URL }}
        run: |
          sudo mkdir -p "/etc/docker/certs.d/$HARBOR_URL"
          printf '%s' "$HARBOR_CA_CRT" | sudo tee "/etc/docker/certs.d/$HARBOR_URL/ca.crt" > /dev/null
          sudo systemctl restart docker
      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: "${{ secrets.HARBOR_URL }}"
          username: "${{ secrets.HARBOR_USERNAME }}"
          password: "${{ secrets.HARBOR_PASSWORD }}"
      - name: Build & push ingestion-service image
        working-directory: vehicle-tracker-backend/ingestion-service/container
        run: ./buildAndPushContainer.sh
      - name: Build & push asset-service image
        working-directory: vehicle-tracker-backend/asset-service/container
        run: ./buildAndPushContainer.sh
      - name: Build & push api-gateway image
        working-directory: vehicle-tracker-backend/api-gateway/container
        run: ./buildAndPushContainer.sh

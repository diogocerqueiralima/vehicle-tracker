name: Backend Build

on:
  push:
    branches-ignore: [ "main" ]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'vehicle-tracker-backend/**'
              - '.github/workflows/backend-build.yml'

  build:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ingestion-service, asset-service, api-gateway, identity-service]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }} image
        working-directory: vehicle-tracker-backend/${{ matrix.service }}/container
        run: ./buildContainer.sh

  build-status:
    name: build
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check build result
        run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "Change detection failed"
            exit 1
          fi
          if [ "${{ needs.changes.outputs.backend }}" != "true" ]; then
            echo "No backend changes, skipping"
            exit 0
          fi
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "One or more service builds failed"
            exit 1
          fi

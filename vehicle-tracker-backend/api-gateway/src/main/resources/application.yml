spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}

gateway:
  routes:
    - id: asset-service
      prefix: /assets
      uri: ${ASSET_SERVICE_URI}
      rules:
        - method: PUT
          path: /devices/{deviceId}
          role: ADMIN